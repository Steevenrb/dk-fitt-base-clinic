version: "2"
type: frontend
tech_stack:
  - TypeScript
  - React 18
  - Vite 5
  - React Router DOM
  - TanStack React Query
  - shadcn/ui
  - Radix UI
  - Tailwind CSS
  - Recharts
  - ECharts
routes:
  - path: /login
    file: src/pages/Login.tsx
    auth_required: false
    description: Login page for administrators and nutritionists
  - path: /cambiar-contrasena
    file: src/pages/ChangePasswordRequired.tsx
    auth_required: true
    description: Mandatory password change screen for temporary-password accounts
  - path: /
    file: src/pages/Index.tsx
    auth_required: true
    description: Nutritionist dashboard with KPIs, charts, patients and alerts
  - path: /pacientes
    file: src/pages/Pacientes.tsx
    auth_required: true
    description: Nutritionist patient list
  - path: /pacientes/:id
    file: src/pages/FichaPaciente.tsx
    auth_required: true
    description: Patient clinical record with summary, profile, evaluations, plans, intake, appointments, follow-up and alerts tabs
  - path: /planes
    file: src/pages/PlanesIndex.tsx
    auth_required: true
    description: Patient selector and nutrition plan index
  - path: /planes/ver/:id
    file: src/pages/PlanesNutricionales.tsx
    auth_required: true
    description: Weekly nutrition plan detail and module controls
  - path: /alimentos
    file: src/pages/AlimentosRecetas.tsx
    auth_required: true
    description: Food database, recipes and recipe constructor tabs
  - path: /seguimiento
    file: src/pages/Seguimiento.tsx
    auth_required: true
    description: Patient follow-up overview for meals and exercises
  - path: /alertas
    file: src/pages/Alertas.tsx
    auth_required: true
    description: Nutritionist alerts inbox and review workflow
  - path: /citas
    file: src/pages/Citas.tsx
    auth_required: true
    description: Nutritionist appointments calendar and appointment management
  - path: /mi-perfil
    file: src/pages/MiPerfil.tsx
    auth_required: true
    description: Nutritionist profile and password update page
  - path: /admin
    file: src/pages/admin/DashboardAdmin.tsx
    auth_required: true
    description: Administrator dashboard with system indicators
  - path: /admin/usuarios
    file: src/pages/admin/GestionUsuarios.tsx
    auth_required: true
    description: Administrator user and nutritionist management
  - path: /admin/historial
    file: src/pages/admin/HistorialActividad.tsx
    auth_required: true
    description: Administrator activity history
  - path: "*"
    file: src/pages/NotFound.tsx
    auth_required: false
    description: Not found page for unknown routes
features:
  - name: Authentication and role routing
    description: Users log in with institutional email and password, then the app redirects by role and blocks unsupported patient access.
    files:
      - src/pages/Login.tsx
      - src/contexts/AuthContext.tsx
      - src/App.tsx
      - src/lib/api.ts
    entry_route: /login
    user_interactions:
      - Fill email field
      - Fill password field
      - Submit login form
      - See validation or API error on invalid credentials
      - Reach nutritionist dashboard or administrator dashboard after successful login
      - Use logout from the app shell
    api_calls:
      - method: POST
        endpoint: /api/auth/login
      - method: GET
        endpoint: /api/auth/me
      - method: POST
        endpoint: /api/auth/logout
    auth_required: false
  - name: Mandatory password change
    description: Accounts flagged for password change must set a new password before using protected routes.
    files:
      - src/pages/ChangePasswordRequired.tsx
      - src/contexts/AuthContext.tsx
    entry_route: /cambiar-contrasena
    user_interactions:
      - Enter current password
      - Enter a new password that matches strength rules
      - Confirm the new password locally
      - Submit password change
      - Return to login after success
    api_calls:
      - method: PATCH
        endpoint: /auth/change-password
    auth_required: true
  - name: Nutritionist dashboard
    description: Nutritionists review weekly KPIs, patient weight trends, planned versus consumed calories, patients and unread alerts.
    files:
      - src/pages/Index.tsx
      - src/components/dashboard/KpiCards.tsx
      - src/components/dashboard/WeightChart.tsx
      - src/components/dashboard/CaloriesChart.tsx
      - src/components/dashboard/PatientsTable.tsx
      - src/components/dashboard/AlertsPanel.tsx
    entry_route: /
    user_interactions:
      - View dashboard KPIs
      - Select up to three patients for the weight chart
      - Inspect calories chart
      - Open patient details from patient summary table
      - Review unread alerts panel
    api_calls:
      - method: GET
        endpoint: /api/patients
      - method: GET
        endpoint: /patients
      - method: GET
        endpoint: /api/pacientes
      - method: GET
        endpoint: /api/weight-records/patient/:id/chart
      - method: GET
        endpoint: /api/calorie-control/patient/:id
    auth_required: true
  - name: Patient list and clinical record
    description: Nutritionists browse assigned patients and open each patient's clinical record tabs.
    files:
      - src/pages/Pacientes.tsx
      - src/pages/FichaPaciente.tsx
      - src/components/ficha/TabResumen.tsx
      - src/components/ficha/TabPerfilClinico.tsx
      - src/components/ficha/TabEvaluaciones.tsx
      - src/components/ficha/TabPlanes.tsx
      - src/components/ficha/TabConsumo.tsx
      - src/components/ficha/TabCitas.tsx
      - src/components/ficha/TabSeguimiento.tsx
      - src/components/ficha/TabAlertas.tsx
    entry_route: /pacientes
    user_interactions:
      - Search or scan patient list
      - Open a patient detail page
      - Switch between clinical record tabs
      - Review summary, profile, evaluations, plans, intake, appointments, follow-up and alerts
    api_calls:
      - method: GET
        endpoint: /api/patients
      - method: GET
        endpoint: /patients
      - method: GET
        endpoint: /api/dashboard/patient/:id
      - method: GET
        endpoint: /api/patient-profile/:patientId
      - method: GET
        endpoint: /api/clinical-evaluations
      - method: GET
        endpoint: /api/additional-intake/patient/:id
      - method: GET
        endpoint: /appointments/patient/:id
      - method: GET
        endpoint: /alerts
    auth_required: true
  - name: Nutrition plans
    description: Nutritionists select patients, view nutrition plans and manage weekly plan activation, suspension, reactivation and daily dish replacements.
    files:
      - src/pages/PlanesIndex.tsx
      - src/pages/PlanesNutricionales.tsx
      - src/components/planes/WeeklyPlanGrid.tsx
      - src/components/planes/PlanConfig.tsx
      - src/components/planes/NutritionalSummary.tsx
      - src/components/planes/MealSchedule.tsx
      - src/components/planes/ExercisePlan.tsx
    entry_route: /planes
    user_interactions:
      - Select a patient with nutrition plan data
      - Open a plan detail
      - Review weekly plan grid
      - Activate, suspend or reactivate a plan
      - Replace a daily menu dish
    api_calls:
      - method: GET
        endpoint: /api/patients
      - method: PATCH
        endpoint: /nutrition-plans/:id/activate
      - method: PATCH
        endpoint: /nutrition-plans/:id/suspend
      - method: PATCH
        endpoint: /nutrition-plans/:id/reactivate
      - method: PATCH
        endpoint: /nutrition-plans/:id/unlock-module
      - method: PATCH
        endpoint: /nutrition-plans/:id/lock-module
      - method: PATCH
        endpoint: /menus-diarios/:id/plato
    auth_required: true
  - name: Food and recipe management
    description: Nutritionists manage detailed foods, browse recipes, generate generic recipes and create dishes from ingredients.
    files:
      - src/pages/AlimentosRecetas.tsx
      - src/components/alimentos/TabAlimentos.tsx
      - src/components/alimentos/TabRecetas.tsx
      - src/components/alimentos/TabConstructor.tsx
      - src/lib/recetasService.ts
    entry_route: /alimentos
    user_interactions:
      - Switch between Alimentos, Recetas and Constructor tabs
      - Create, edit and delete detailed foods
      - Browse recipes and recipe details
      - Generate a generic recipe
      - Build and save a dish from selected foods
    api_calls:
      - method: GET
        endpoint: /api/alimentos-detalle
      - method: POST
        endpoint: /api/alimentos-detalle
      - method: PATCH
        endpoint: /api/alimentos-detalle/:id
      - method: DELETE
        endpoint: /api/alimentos-detalle/:id
      - method: GET
        endpoint: /dishes
      - method: POST
        endpoint: /dishes
      - method: POST
        endpoint: /recipe-generator/generate
      - method: POST
        endpoint: /recipe-generator/generate-generic
      - method: GET
        endpoint: /tiempos-comida
      - method: GET
        endpoint: /aptitudes-clinicas
    auth_required: true
  - name: Follow-up
    description: Nutritionists review patient adherence and meal or exercise tracking from the follow-up page.
    files:
      - src/pages/Seguimiento.tsx
      - src/components/ficha/TabSeguimiento.tsx
    entry_route: /seguimiento
    user_interactions:
      - View patient follow-up list
      - Select a patient
      - Review meals and exercises
      - Inspect adherence-related status
    api_calls:
      - method: GET
        endpoint: /api/patients
      - method: GET
        endpoint: /patients
    auth_required: true
  - name: Alerts
    description: Nutritionists review alerts and mark them as reviewed.
    files:
      - src/pages/Alertas.tsx
      - src/components/ficha/TabAlertas.tsx
    entry_route: /alertas
    user_interactions:
      - Open alerts inbox
      - Review alert details
      - Mark an alert as reviewed
    api_calls:
      - method: GET
        endpoint: /alerts
      - method: PATCH
        endpoint: /alerts/:id/review
    auth_required: true
  - name: Appointments
    description: Nutritionists view patient appointments, create or update appointments and change appointment status.
    files:
      - src/pages/Citas.tsx
      - src/components/ficha/TabCitas.tsx
    entry_route: /citas
    user_interactions:
      - View appointment list
      - Filter or inspect appointments
      - Create a new appointment
      - Edit an existing appointment
      - Change appointment status
    api_calls:
      - method: GET
        endpoint: /appointments
      - method: POST
        endpoint: /appointments
      - method: PUT
        endpoint: /appointments/:id
      - method: PATCH
        endpoint: /appointments/:id/status
      - method: GET
        endpoint: /api/patients
    auth_required: true
  - name: Nutritionist profile
    description: Nutritionists view profile data and update their own password.
    files:
      - src/pages/MiPerfil.tsx
      - src/components/TopBar.tsx
    entry_route: /mi-perfil
    user_interactions:
      - Open profile page
      - Review personal and professional data
      - Change password from profile
    api_calls:
      - method: GET
        endpoint: /api/nutritionist-profile/me
      - method: GET
        endpoint: /api/auth/me
      - method: PATCH
        endpoint: /auth/change-password
    auth_required: true
  - name: Administrator dashboard
    description: Administrators review system-level indicators and navigation to user management and activity history.
    files:
      - src/pages/admin/DashboardAdmin.tsx
      - src/components/AdminLayout.tsx
      - src/components/AdminSidebar.tsx
      - src/components/AdminTopBar.tsx
    entry_route: /admin
    user_interactions:
      - View administrator dashboard cards and charts
      - Navigate to user management
      - Navigate to activity history
    api_calls:
      - method: GET
        endpoint: /api/admin/dashboard
    auth_required: true
  - name: Administrator user management
    description: Administrators list users, create nutritionists, edit user data, toggle status and reset temporary passwords.
    files:
      - src/pages/admin/GestionUsuarios.tsx
    entry_route: /admin/usuarios
    user_interactions:
      - Search and filter users
      - Open create nutritionist dialog
      - Submit nutritionist data
      - Edit an existing user
      - Activate or deactivate a user
      - Reset a user's temporary password
    api_calls:
      - method: GET
        endpoint: /api/admin/users
      - method: POST
        endpoint: /api/admin/nutritionists
      - method: PATCH
        endpoint: /api/admin/users/:id
      - method: PATCH
        endpoint: /api/admin/users/:id/status
      - method: POST
        endpoint: /api/admin/users/:id/reset-password
    auth_required: true
  - name: Administrator activity history
    description: Administrators inspect audit activity from the activity history page.
    files:
      - src/pages/admin/HistorialActividad.tsx
    entry_route: /admin/historial
    user_interactions:
      - Open activity history page
      - Review recent administrative actions
      - Search or filter available history records
    api_calls:
      - method: GET
        endpoint: /api/admin/activity-history
    auth_required: true
known_limitations:
  - issue: TestSprite is connected to a Vite dev server on port 8080, so generated frontend execution may be limited to high-priority tests for stability.
    location: local test environment
    impact: Full concurrent coverage may require running a production build with vite preview on the configured port.
  - issue: Several modules intentionally try fallback endpoints for the same resource.
    location: src/lib/api.ts and feature pages
    impact: Tests may see successful behavior through alternate endpoint paths depending on backend availability.
